[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tp_ae2"
version = "1.0.0"
description = "TP de Análisis Estadístico 2 (FCE UBA, cátedra Tito Lasanta): variación del PBI real y variación del bono AL30D"
authors = [
    { name = "Matías Rodrigo Bellido" },
    { name = "Luka Orpianesi" },
    { name = "Manuel Rodriguez" },
    { name = "Melina Escalante" },
    { name = "Maria Acevedo" },
]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "statsmodels>=0.14",
    "matplotlib>=3.8",
    "jinja2>=3.1",
    "pyyaml>=6.0",
    "openpyxl>=3.1",
]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tp_ae2 = ["web/*", "plantillas/*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]