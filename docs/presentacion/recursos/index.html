<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Recursos · Guion de la exposición</title>
<meta name="description" content="Guion de cada orador para la exposición del TP de Análisis Estadístico 2 (Grupo 1). Se abre con el código del grupo.">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#111726">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23111726'/%3E%3Cpath d='M5 22l6-7 5 4 5-9 6 6' fill='none' stroke='%233b8beb' stroke-width='2.6' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
/* Recursos: guion de la exposición detrás del código del grupo. Mismo universo visual que el deck (azul noche,
   serif para títulos, celeste de acento). Tokens acá; nada de valores sueltos más abajo. */
:root {
  color-scheme: dark;
  --bg: #111726; --bg-out: #0a0e17; --card: #151b26; --card-2: #1b2334; --borde: #273046; --borde-2: #33405c;
  --tx: #c3c7cf; --blanco: #fff; --mut: #a4adbc; --kick: #62bceb; --azul: #3b8beb; --naranja: #e8612c;
  --accion: #2667cc;          /* blanco encima: 5,4:1 (el azul del deck da 3,5:1, no alcanza para texto) */
  --borde-control: #5f6e92;   /* borde de las casillas: 3,4:1 contra la tarjeta (WCAG 1.4.11) */
  --ok: #6fdc9a; --error: #ff8a7a; --error-fondo: #3a1d1d; --ok-fondo: #15302a;
  --serif: "Times New Roman", Tinos, Times, "Liberation Serif", serif;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, "Noto Sans", sans-serif;
  --e1: 4px; --e2: 8px; --e3: 12px; --e4: 16px; --e5: 24px; --e6: 32px; --e7: 48px; --e8: 64px;
  --r-pill: 999px; --r-tarjeta: 14px; --r-control: 10px;
  --curva: cubic-bezier(.2, .8, .2, 1); --rapido: .18s; --medio: .28s;
  --sombra: 0 18px 50px rgba(0, 0, 0, .35);
}
* { box-sizing: border-box; }
html { background: var(--bg-out); }
body { margin: 0; min-height: 100vh; min-height: 100dvh; background: var(--bg); color: var(--tx); font: 16px/1.5 var(--sans); -webkit-font-smoothing: antialiased; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
a { color: var(--kick); }
:focus-visible { outline: 2px solid var(--kick); outline-offset: 3px; border-radius: 6px; }
.sr-only { position: absolute; width: 1px; height: 1px; margin: -1px; padding: 0; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.saltar { position: absolute; left: var(--e4); top: -64px; z-index: 50; padding: var(--e2) var(--e4); background: var(--card); color: var(--blanco); border-radius: var(--r-control); }
.saltar:focus { top: var(--e4); }
kbd { font: 600 11px/1 var(--sans); color: #dfe5f0; border: 1px solid var(--borde-2); border-bottom-width: 2px; border-radius: 5px; padding: 2px 5px; }
[hidden] { display: none !important; }

/* Barras de scroll con la identidad del deck */
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a3550; border: 2px solid var(--bg); border-radius: var(--r-pill); }
::-webkit-scrollbar-thumb:hover { background: #36456a; }
::-webkit-scrollbar-button { display: none; }
@supports not selector(::-webkit-scrollbar) { html, .linea, .notas { scrollbar-color: #2a3550 transparent; scrollbar-width: thin; } }

/* Cabecera */
.cab {
  position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: var(--e3); flex-wrap: wrap;
  padding: var(--e2) clamp(var(--e4), 3vw, var(--e6)); min-height: 56px; background: rgba(13, 18, 30, .92);
  border-bottom: 1px solid var(--borde); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
}
.cab__volver { display: inline-flex; align-items: center; gap: var(--e2); min-height: 40px; padding: 0 var(--e3); margin-left: calc(var(--e3) * -1); border-radius: var(--r-pill); color: var(--tx); text-decoration: none; font-weight: 500; }
.cab__volver:hover { background: var(--card-2); color: var(--blanco); }
.cab__volver svg { width: 18px; height: 18px; }
.cab__titulo { font: 700 15px/1.2 var(--serif); color: var(--blanco); letter-spacing: .01em; }
.cab__titulo span { font: 400 14px/1.2 var(--sans); color: var(--mut); }
.cab__acciones { display: flex; align-items: center; gap: var(--e2); margin-left: auto; flex-wrap: wrap; }
.boton {
  display: inline-flex; align-items: center; gap: var(--e2); min-height: 40px; padding: 0 var(--e4); border: 1px solid var(--borde);
  border-radius: var(--r-pill); background: var(--card); color: var(--tx); cursor: pointer; font-size: 14px; font-weight: 500;
  transition: background-color var(--rapido), border-color var(--rapido), color var(--rapido), transform var(--rapido);
}
.boton:hover { background: var(--card-2); border-color: var(--borde-2); color: var(--blanco); }
.boton:active { transform: scale(.97); }
.boton[aria-pressed="true"] { border-color: var(--kick); color: var(--blanco); }
.boton--icono { width: 40px; padding: 0; justify-content: center; }
.boton svg { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* Reloj */
.reloj { display: flex; align-items: baseline; gap: var(--e2); padding: 0 var(--e2); font-variant-numeric: tabular-nums; }
.reloj__tiempo { font: 700 20px/1 var(--sans); color: var(--blanco); min-width: 3.2ch; text-align: right; }
.reloj__plan { font-size: 13px; color: var(--mut); }
.reloj[data-estado="tarde"] .reloj__tiempo { color: #ffc46b; }
.reloj[data-estado="muy-tarde"] .reloj__tiempo { color: var(--error); }

/* ── Puerta: código de 3 casillas ───────────────────────────────────────────── */
.puerta { display: grid; place-items: center; min-height: calc(100vh - 57px); min-height: calc(100dvh - 57px); padding: var(--e6) var(--e4); }
.puerta__tarjeta {
  width: min(100%, 440px); padding: var(--e6) clamp(var(--e5), 5vw, var(--e6)); text-align: center; background: var(--card);
  border: 1px solid var(--borde); border-radius: var(--r-tarjeta); box-shadow: var(--sombra);
}
.puerta__icono { width: 44px; height: 44px; margin: 0 auto var(--e4); display: block; color: var(--kick); fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.puerta h1 { font: 700 30px/1.15 var(--serif); color: var(--blanco); letter-spacing: -.01em; }
.puerta__bajada { margin-top: var(--e3); color: var(--tx); font-size: 15px; }
.codigo { margin-top: var(--e6); text-align: left; }
.codigo__cabecera { display: flex; justify-content: space-between; align-items: baseline; gap: var(--e3); }
.codigo__etiqueta { font-weight: 600; color: var(--blanco); font-size: 15px; }
.codigo__formato { font-size: 13px; color: var(--mut); }
.codigo__casillas { display: grid; grid-template-columns: repeat(3, 64px); justify-content: center; gap: var(--e3); margin-top: var(--e3); }
.codigo__casilla {
  width: 64px; height: 72px; padding: 0; text-align: center; font: 700 32px/1 var(--sans); font-variant-numeric: tabular-nums;
  color: var(--blanco); background: var(--bg); border: 2px solid var(--borde-control); border-radius: var(--r-control); caret-color: var(--kick);
  transition: border-color var(--rapido), background-color var(--rapido), box-shadow var(--rapido);
}
.codigo__casilla:hover { border-color: #7383aa; }
.codigo__casilla:focus { outline: none; border-color: var(--kick); box-shadow: 0 0 0 4px rgba(98, 188, 235, .22); }
.codigo__casilla:disabled { opacity: .6; }
.codigo--error .codigo__casilla { border-color: var(--error); background: var(--error-fondo); }
.codigo--ok .codigo__casilla { border-color: var(--ok); background: var(--ok-fondo); }
.codigo__ayuda { margin-top: var(--e3); font-size: 13px; color: var(--mut); text-align: center; min-height: 20px; }
.codigo__error { margin-top: var(--e2); font-size: 14px; color: var(--error); text-align: center; min-height: 0; }
.codigo__error:empty { display: none; }
.codigo__abrir {
  display: block; width: 100%; min-height: 48px; margin-top: var(--e5); border: 0; border-radius: var(--r-pill);
  background: var(--accion); color: var(--blanco); font-weight: 600; font-size: 15px; cursor: pointer;
  transition: filter var(--rapido), transform var(--rapido), box-shadow var(--rapido);
}
.codigo__abrir:hover { filter: brightness(1.06); box-shadow: 0 0 24px rgba(59, 139, 235, .35); }
.codigo__abrir:active { transform: scale(.98); }
.codigo__abrir:disabled { opacity: .55; cursor: default; filter: none; box-shadow: none; }
@media (prefers-reduced-motion: no-preference) {
  .codigo--sacude .codigo__casillas { animation: sacude .32s var(--curva) 1; }
  @keyframes sacude { 20% { transform: translateX(-8px); } 45% { transform: translateX(7px); } 70% { transform: translateX(-4px); } 90% { transform: translateX(2px); } }
  .puerta--sale { animation: sale .26s var(--curva) both; }
  @keyframes sale { to { opacity: 0; transform: translateY(-8px) scale(.99); } }
  .guion--entra { animation: entra .32s var(--curva) both; }
  @keyframes entra { from { opacity: 0; transform: translateY(8px); } }
}

/* ── Guion ─────────────────────────────────────────────────────────────────── */
.guion { padding: var(--e4) clamp(var(--e4), 3vw, var(--e6)) var(--e7); }
.guion__barra { display: flex; align-items: center; gap: var(--e4); flex-wrap: wrap; }
/* Segmentos de igual ancho (Presentador | Guion completo) */
.segmentos { display: inline-grid; grid-template-columns: 1fr 1fr; padding: var(--e1); background: var(--card); border: 1px solid var(--borde); border-radius: var(--r-pill); }
.segmentos button { min-height: 36px; padding: 0 var(--e4); border: 0; border-radius: var(--r-pill); background: transparent; color: var(--mut); cursor: pointer; font-size: 14px; font-weight: 600; white-space: nowrap; transition: background-color var(--rapido), color var(--rapido); }
.segmentos button:hover { color: var(--blanco); }
.segmentos button[aria-pressed="true"] { background: var(--card-2); color: var(--blanco); box-shadow: inset 0 0 0 1px var(--borde-2); }
.guion__total { font-size: 13px; color: var(--mut); }

/* Línea de oradores: un tramo por bloque, ancho proporcional a su tiempo */
.linea { display: flex; gap: var(--e1); list-style: none; margin: var(--e4) 0 0; padding: 0 0 var(--e1); overflow-x: auto; }
.linea li { flex: var(--peso) 1 0; min-width: max-content; }
.linea button {
  position: relative; display: grid; gap: 2px; width: 100%; padding: var(--e2) var(--e3) var(--e2); text-align: left; border: 0;
  border-radius: var(--r-control); background: var(--card); color: var(--tx); cursor: pointer; overflow: hidden;
  transition: background-color var(--rapido);
}
.linea button::before { content: ""; position: absolute; inset: 0 0 auto 0; height: 3px; background: var(--color); opacity: .45; transition: opacity var(--rapido); }
.linea button:hover { background: var(--card-2); }
.linea button[aria-current="step"] { background: var(--card-2); box-shadow: inset 0 0 0 1px var(--color); }
.linea button[aria-current="step"]::before { opacity: 1; }
.linea__nombre { font-weight: 700; font-size: 14px; color: var(--blanco); white-space: nowrap; }
.linea__tema { font-size: 12px; color: var(--mut); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.linea__tiempo { font-size: 12px; color: var(--mut); font-variant-numeric: tabular-nums; white-space: nowrap; }

/* Vista del presentador: diapositiva en vivo (iframe del deck) + notas */
.presentador { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(320px, 1fr); gap: var(--e5); margin-top: var(--e5); align-items: start; }
.escenario { position: sticky; top: 72px; }
.escenario__marco { position: relative; aspect-ratio: 16 / 9; border-radius: var(--r-tarjeta); overflow: hidden; background: var(--bg-out); box-shadow: 0 0 0 1px var(--borde), var(--sombra); }
.escenario__marco iframe { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
.escenario__controles { display: flex; align-items: center; gap: var(--e2); margin-top: var(--e3); flex-wrap: wrap; }
.contador { min-width: 64px; text-align: center; font-variant-numeric: tabular-nums; font-weight: 600; color: var(--blanco); }
.escenario__sigue { margin-left: auto; font-size: 13px; color: var(--mut); min-width: 0; }
.escenario__sigue strong { color: var(--tx); font-weight: 600; }

/* Marcas numeradas sobre la diapositiva */
.pines { position: absolute; inset: 0; pointer-events: none; }
.pines, .completo__imagen { --pin: 26px; }
.pin {
  position: absolute; left: calc(var(--x) * 1%); top: calc(var(--y) * 1%); display: grid; place-items: center;
  width: var(--pin); height: var(--pin); margin: calc(var(--pin) / -2) 0 0 calc(var(--pin) / -2); border-radius: 50%;
  background: var(--color, var(--kick)); color: #0b1220; font: 800 calc(var(--pin) * .5)/1 var(--sans);
  box-shadow: 0 0 0 3px rgba(11, 18, 32, .75), 0 4px 14px rgba(0, 0, 0, .45);
  opacity: 0; transform: scale(.6); transition: opacity var(--medio) var(--curva), transform var(--medio) var(--curva);
}
/* Marca de un texto: a la izquierda de su primera línea, sin salirse de la diapositiva */
.pin--izq { left: max(calc(var(--pin) / 2 + 2px), calc(var(--x) * 1% - var(--pin) * .8)); top: calc(var(--y) * 1% + var(--pin) * .45); }
.completo__imagen { --pin: 22px; }
.pines--listo .pin { opacity: 1; transform: none; }
.pin--activo { transform: scale(1.25) !important; box-shadow: 0 0 0 3px rgba(11, 18, 32, .75), 0 0 0 7px var(--color); }

.notas { display: grid; gap: var(--e4); }
.notas__cabecera { display: flex; align-items: baseline; gap: var(--e3); flex-wrap: wrap; }
.notas__num { font: 700 13px/1 var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--kick); }
.notas__titulo { font: 700 22px/1.2 var(--serif); color: var(--blanco); }

/* Un paso del guion: quién habla, cómo, qué dice y a quién le pasa */
.paso { --color: var(--kick); position: relative; padding: var(--e4) var(--e5) var(--e5); background: var(--card); border: 1px solid var(--borde); border-radius: var(--r-tarjeta); }
.paso::before { content: ""; position: absolute; left: 0; top: var(--e4); bottom: var(--e4); width: 3px; border-radius: 0 3px 3px 0; background: var(--color); }
.paso__cab { display: flex; align-items: center; gap: var(--e2) var(--e3); flex-wrap: wrap; }
.chip { display: inline-flex; align-items: center; gap: var(--e2); padding: var(--e1) var(--e3) var(--e1) var(--e2); border-radius: var(--r-pill); background: color-mix(in srgb, var(--color) 16%, transparent); color: var(--blanco); font-weight: 700; font-size: 14px; }
.chip::before { content: ""; width: 10px; height: 10px; border-radius: 50%; background: var(--color); }
.paso__tema { font-size: 14px; color: var(--tx); font-weight: 600; }
.paso__tiempo { margin-left: auto; font-size: 13px; color: var(--mut); font-variant-numeric: tabular-nums; }
.paso__como { margin-top: var(--e3); font-size: 14px; color: var(--mut); }
.paso__como b { color: var(--tx); font-weight: 600; }
.paso__texto { display: grid; gap: var(--e3); margin-top: var(--e4); font: 19px/1.55 var(--serif); color: #e7eaf0; }
.paso__texto strong { color: var(--blanco); font-weight: 700; background: linear-gradient(transparent 62%, color-mix(in srgb, var(--color) 32%, transparent) 62%); padding: 0 1px; }
.pase {
  display: flex; gap: var(--e2); align-items: baseline; flex-wrap: wrap; margin-top: var(--e4); padding: var(--e3) var(--e4); border-radius: var(--r-control);
  background: var(--bg); border: 1px dashed var(--borde-2); font-size: 15px;
}
.pase__a { font-weight: 700; color: var(--blanco); white-space: nowrap; }
.pase__a i { font-style: normal; color: var(--pase-color, var(--kick)); }
.pase q { font-family: var(--serif); font-size: 17px; color: #e7eaf0; quotes: "«" "»"; }

/* Marcas de interpretación dentro del texto */
.cue { display: inline-flex; align-items: center; gap: 4px; margin: 0 2px; padding: 1px 8px; border-radius: var(--r-pill); font: 600 12px/1.6 var(--sans); vertical-align: 2px; white-space: nowrap; border: 1px solid transparent; }
.cue--pausa { color: #ffd38a; background: rgba(255, 196, 107, .12); border-color: rgba(255, 196, 107, .28); }
.cue--pausa::before { content: ""; width: 7px; height: 9px; border-left: 2px solid currentColor; border-right: 2px solid currentColor; }
.cue--enfasis { color: var(--color); background: color-mix(in srgb, var(--color) 14%, transparent); border-color: color-mix(in srgb, var(--color) 35%, transparent); }
.cue--publico { color: #9fe3c7; background: rgba(111, 220, 154, .1); border-color: rgba(111, 220, 154, .25); }
.cue--lento { color: #c9b8ff; background: rgba(185, 166, 242, .12); border-color: rgba(185, 166, 242, .28); }
button.cue--senal { cursor: pointer; color: var(--blanco); background: color-mix(in srgb, var(--color) 22%, transparent); border-color: color-mix(in srgb, var(--color) 50%, transparent); }
button.cue--senal:hover, button.cue--senal:focus-visible { background: color-mix(in srgb, var(--color) 36%, transparent); }
.cue__num { display: inline-grid; place-items: center; width: 16px; height: 16px; border-radius: 50%; background: var(--color); color: #0b1220; font-size: 10px; font-weight: 800; }

.leyenda { margin-top: var(--e2); padding: var(--e2) var(--e4); font-size: 13px; color: var(--mut); background: var(--card); border: 1px solid var(--borde); border-radius: var(--r-tarjeta); }
.leyenda summary { cursor: pointer; min-height: 32px; display: flex; align-items: center; color: var(--tx); font-weight: 600; }
.leyenda__items { display: flex; flex-wrap: wrap; gap: var(--e2) var(--e4); padding: var(--e1) 0 var(--e2); }
.leyenda b { color: var(--tx); font-weight: 600; }

/* Guion completo: todas las diapositivas con sus marcas y sus notas */
.completo { list-style: none; margin: var(--e5) 0 0; padding: 0; display: grid; gap: var(--e7); }
.completo__item { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: var(--e5); align-items: start; scroll-margin-top: 80px; }
.completo__diapo { margin: 0; position: sticky; top: 72px; }
.completo__imagen { position: relative; aspect-ratio: 16 / 9; border-radius: var(--r-tarjeta); overflow: hidden; background: var(--bg-out); box-shadow: 0 0 0 1px var(--borde); }
.completo__imagen img { display: block; width: 100%; height: 100%; object-fit: cover; }
.completo__imagen .pin { opacity: 1; transform: none; }
.completo__pie { display: flex; align-items: center; gap: var(--e3); margin-top: var(--e2); font-size: 14px; color: var(--mut); }
.completo__pie strong { color: var(--blanco); font-family: var(--serif); font-size: 17px; }
.completo__notas { display: grid; gap: var(--e4); }

@media (max-width: 1100px) {
  .presentador, .completo__item { grid-template-columns: minmax(0, 1fr); }
  .escenario, .completo__diapo { position: static; }
}
@media (max-width: 640px) {
  .cab { gap: var(--e2); }
  .cab__titulo span { display: none; }
  .cab__acciones { width: 100%; justify-content: space-between; margin-left: 0; gap: var(--e1); flex-wrap: nowrap; }
  .boton { padding: 0 var(--e3); }
  .cab__acciones .boton { width: 40px; padding: 0; justify-content: center; }
  .reloj { padding: 0; }
  .reloj__total { display: none; }
  .linea__tema { display: none; }
  .completo__imagen { --pin: 16px; }
  .boton__texto { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
  .paso { padding: var(--e4); }
  .paso__texto { font-size: 18px; }
  .paso__tiempo { margin-left: 0; width: 100%; }
  .codigo__casillas { grid-template-columns: repeat(3, 60px); }
  .codigo__casilla { width: 60px; height: 68px; }
}

/* Pantallas táctiles: todos los controles de al menos 44 × 44 px */
@media (pointer: coarse) {
  .boton, .cab__volver, .segmentos button { min-height: 44px; }
  .boton--icono, .cab__acciones .boton { width: 44px; }
}

/* Impresión: el guion completo, claro y sin controles */
@media print {
  :root { --bg: #fff; --bg-out: #fff; --card: #fff; --card-2: #fff; --borde: #ccd2dc; --tx: #1b2230; --blanco: #0b1220; --mut: #4b5563; }
  body { background: #fff; color: var(--tx); }
  .cab, .puerta, .guion__barra, .linea, .presentador, .saltar { display: none !important; }
  [data-panel="completo"][hidden] { display: grid !important; }
  .completo__item { break-inside: avoid; grid-template-columns: 1fr; }
  .completo__diapo { position: static; }
  .paso__texto { color: #111; }
}

</style>
</head>
<body>
<a class="saltar" href="#contenido">Saltar al contenido</a>
<header class="cab">
  <a class="cab__volver" href="../"><svg viewBox="0 0 24 24" aria-hidden="true" focusable="false" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg><span>Presentación</span></a>

<script>
/* Recursos: código de 3 casillas → descifra el guion (WebCrypto) → vista del presentador sincronizada con el deck.
   Sincronización: la vista previa es un iframe del deck (?modo=notas) que avisa por postMessage en qué diapositiva
   está; si el deck está abierto en otra pestaña del mismo navegador, se siguen por BroadcastChannel ("tp-ae2-pitch"). */
(() => {
  "use strict";
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const CLAVE = { vista: "tp-ae2-recursos-vista", reloj: "tp-ae2-recursos-reloj" };
  const publico = JSON.parse($("#guion-publico").textContent);
  const cifrado = JSON.parse($("#guion-cifrado").textContent);
  const total = publico.diapositivas.length;
  const form = $("[data-codigo]");
  const casillas = $$("[data-casilla]");
  const ayuda = $("[data-ayuda]");
  const error = $("[data-error]");
  const abrir = $("[data-abrir]");
  const puerta = $("[data-puerta]");
  const seccion = $("[data-guion]");
  const acciones = $("[data-acciones]");
  const anuncio = $("[data-anuncio]");
  const reducido = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const AYUDA = ayuda.textContent;

  const guardar = (clave, valor) => { try { valor == null ? sessionStorage.removeItem(clave) : sessionStorage.setItem(clave, valor); } catch (e) { /* sin almacenamiento */ } };
  const leer = (clave) => { try { return sessionStorage.getItem(clave); } catch (e) { return null; } };
  const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const reloj = (seg) => { seg = Math.max(0, Math.round(seg)); return `${Math.floor(seg / 60)}:${String(seg % 60).padStart(2, "0")}`; };

  /* ── Código de 3 casillas: un dígito por casilla, avanza solo, Backspace vuelve, se puede pegar ─────────── */
  const codigo = () => casillas.map((c) => c.value).join("");
  function limpiarError() {
    error.textContent = "";
    form.classList.remove("codigo--error");
    casillas.forEach((c) => c.removeAttribute("aria-invalid"));
  }
  function mostrarError(texto) {
    error.textContent = texto;
    form.classList.add("codigo--error");
    form.classList.remove("codigo--sacude");
    void form.offsetWidth;
    form.classList.add("codigo--sacude");
    casillas.forEach((c) => c.setAttribute("aria-invalid", "true"));
  }
  form.addEventListener("animationend", () => form.classList.remove("codigo--sacude"));
  function repartir(desde, digitos) {
    for (let i = 0; i < digitos.length && desde + i < casillas.length; i++) casillas[desde + i].value = digitos[i];
    casillas[Math.min(desde + digitos.length, casillas.length - 1)].focus();
    if (codigo().length === casillas.length) intentar();
  }
  casillas.forEach((c, i) => {
    c.addEventListener("focus", () => c.select());
    c.addEventListener("input", () => {
      const d = c.value.replace(/\D/g, "");
      limpiarError();
      if (!d) { c.value = ""; return; }
      c.value = d[0];
      if (d.length > 1) { repartir(i, d); return; } // autocompletado o teclados que mandan varios dígitos juntos
      if (i < casillas.length - 1) casillas[i + 1].focus();
      else if (codigo().length === casillas.length) intentar();
    });
    c.addEventListener("keydown", (e) => {
      if (e.key === "Backspace" && !c.value && i > 0) { e.preventDefault(); casillas[i - 1].value = ""; casillas[i - 1].focus(); }
      else if (e.key === "ArrowLeft" && i > 0) { e.preventDefault(); casillas[i - 1].focus(); }
      else if (e.key === "ArrowRight" && i < casillas.length - 1) { e.preventDefault(); casillas[i + 1].focus(); }
      else if (e.key.length === 1 && /\D/.test(e.key) && !e.ctrlKey && !e.metaKey) e.preventDefault(); // solo números
    });
    c.addEventListener("paste", (e) => {
      const d = ((e.clipboardData || window.clipboardData).getData("text") || "").replace(/\D/g, "").slice(0, casillas.length);
      e.preventDefault();
      if (!d) return;
      limpiarError();
      casillas.forEach((x) => { x.value = ""; });
      repartir(0, d);
    });
  });
  form.addEventListener("submit", (e) => {
    e.preventDefault();
    if (codigo().length < casillas.length) {
      mostrarError("Faltan números: el código tiene tres.");
      (casillas.find((c) => !c.value) || casillas[0]).focus();
      return;
    }
    intentar();
  });

  async function descifrar(cod) {
    const deB64 = (s) => Uint8Array.from(atob(s), (ch) => ch.charCodeAt(0));
    const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(cod), "PBKDF2", false, ["deriveKey"]);
    const clave = await crypto.subtle.deriveKey(
      { name: "PBKDF2", salt: deB64(cifrado.sal), iterations: cifrado.iteraciones, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
    const plano = await crypto.subtle.decrypt({ name: "AES-GCM", iv: deB64(cifrado.iv) }, clave, deB64(cifrado.datos));
    return JSON.parse(new TextDecoder().decode(plano));
  }

  let ocupado = false;
  async function intentar() {
    const cod = codigo();
    if (ocupado || !/^\d{3}$/.test(cod)) return;
    if (!window.crypto || !crypto.subtle) {
      mostrarError("Esta página se abre desde la web publicada o desde localhost, no como archivo.");
      return;
    }
    ocupado = true;
    casillas.forEach((c) => { c.disabled = true; });
    abrir.disabled = true;
    const espera = setTimeout(() => { ayuda.textContent = "Verificando…"; }, 600);
    try {
      const datos = await descifrar(cod);
      clearTimeout(espera);
      form.classList.add("codigo--ok");
      ayuda.textContent = "Código correcto.";
      setTimeout(() => abrirGuion(datos, true), reducido ? 0 : 280);
    } catch (err) {
      clearTimeout(espera);
      ayuda.textContent = AYUDA;
      casillas.forEach((c) => { c.disabled = false; c.value = ""; });
      abrir.disabled = false;
      mostrarError("Ese código no abre el guion. Revisalo con el grupo.");
      casillas[0].focus();
    } finally {
      ocupado = false;
    }
  }

  /* ── Guion ─────────────────────────────────────────────────────────────────────────────────────────────── */
  let G = null;
  let n = 1;
  let vista = leer(CLAVE.vista) || (matchMedia("(max-width: 760px)").matches ? "completo" : "presentador");
  let iframe = null;
  const canal = "BroadcastChannel" in window ? new BroadcastChannel("tp-ae2-pitch") : null;

  const pasosDe = (k) => G.pasos.filter((p) => p.n === k);
  const bloqueDe = (p) => G.bloques[p.bloque];
  const colorDe = (p) => G.oradores[bloqueDe(p).orador].color;
  function colorDePin(k, num) {
    const p = pasosDe(k).find((x) => x.marcas.some((m) => m.num === num));
    return p ? colorDe(p) : "var(--kick)";
  }
  function textoDePin(k, num) {
    for (const p of pasosDe(k)) { const m = p.marcas.find((x) => x.num === num); if (m) return m.texto; }
    return "";
  }

  function textoConMarcas(texto, paso) {
    let h = esc(texto);
    h = h.replace(/\*\*(.+?)\*\*/g, '<span class="cue cue--enfasis">énfasis</span><strong>$1</strong>');
    h = h.replace(/\[pausa (\d+(?:,\d+)?)s\]/g, '<span class="cue cue--pausa">pausa $1 s</span>');
    h = h.replace(/\[público\]/g, '<span class="cue cue--publico">al público</span>');
    h = h.replace(/\[lento\]/g, '<span class="cue cue--lento">más lento</span>');
    h = h.replace(/\[señalar (\d+)\]/g, (_, k) => {
      const m = paso.marcas[Number(k) - 1];
      if (!m) return "";
      return `<button type="button" class="cue cue--senal" data-pin="${m.num}" aria-label="Señalá la marca ${m.num}: ${esc(m.texto)}">` +
        `<span class="cue__num" aria-hidden="true">${m.num}</span>${esc(m.texto)}</button>`;
    });
    return h;
  }

  function pasoHTML(p) {
    const b = bloqueDe(p);
    const delBloque = G.pasos.filter((x) => x.bloque === p.bloque);
    let pase = "";
    if (b.pase && delBloque[delBloque.length - 1] === p) {
      const a = G.oradores[b.pase.a];
      pase = `<p class="pase" style="--pase-color:${esc(a.color)}"><span class="pase__a">Pase a <i>${esc(a.nombre)}</i></span>` +
        `<q>${esc(b.pase.frase)}</q></p>`;
    }
    return `<article class="paso" style="--color:${esc(colorDe(p))}" aria-label="${esc(b.etiqueta)}, ${esc(b.tema)}">` +
      `<header class="paso__cab"><span class="chip">${esc(b.etiqueta)}</span><span class="paso__tema">${esc(b.tema)}</span>` +
      `<span class="paso__tiempo">${reloj(p.inicio)} a ${reloj(p.inicio + p.segundos)} · ${p.segundos} s</span></header>` +
      (p.como ? `<p class="paso__como"><b>Cómo:</b> ${esc(p.como)}</p>` : "") +
      `<div class="paso__texto">${p.guion.map((l) => `<p>${textoConMarcas(l, p)}</p>`).join("")}</div>${pase}</article>`;
  }

  const pinHTML = (k, m) => `<span class="pin${m.centro ? "" : " pin--izq"}" data-pin="${m.num}" ` +
    `style="--x:${m.x};--y:${m.y};--color:${esc(colorDePin(k, m.num))}" title="${esc(textoDePin(k, m.num))}">${m.num}</span>`;

  function armar() {
    const ICONO = { ant: '<path d="M15 6l-6 6 6 6"/>', sig: '<path d="M9 6l6 6-6 6"/>' };
    const svg = (d) => `<svg viewBox="0 0 24 24" aria-hidden="true" focusable="false">${d}</svg>`;
    seccion.innerHTML =
      `<h2 class="sr-only" tabindex="-1" data-foco>Guion de la exposición</h2>` +
      `<div class="guion__barra"><div class="segmentos" role="group" aria-label="Vista">` +
      `<button type="button" data-vista="presentador">Presentador</button><button type="button" data-vista="completo">Guion completo</button></div>` +
      `<p class="guion__total">${G.bloques.length} bloques · ${esc(G.duracion_texto)} en total · ${total} diapositivas</p></div>` +
      `<ol class="linea" aria-label="Orden de los oradores">` + G.bloques.map((b, i) =>
        `<li style="--peso:${b.segundos};--color:${esc(G.oradores[b.orador].color)}"><button type="button" data-bloque="${i}">` +
        `<span class="linea__nombre">${esc(b.etiqueta)}</span><span class="linea__tema">${esc(b.tema)}</span>` +
        `<span class="linea__tiempo">${reloj(b.inicio)} · dura ${reloj(b.segundos)}</span></button></li>`).join("") + `</ol>` +
      (G.leyenda && G.leyenda.length ? `<details class="leyenda" data-leyenda><summary>Cómo leer las marcas</summary><p class="leyenda__items">${G.leyenda.map((l) => {
        const [a, ...resto] = l.split(":");
        return `<span><b>${esc(a)}:</b>${esc(resto.join(":"))}</span>`;
      }).join("")}</p></details>` : "") +
      `<div class="presentador" data-panel="presentador"><div class="escenario">` +
      `<div class="escenario__marco"><iframe title="Vista previa de la diapositiva actual" src="${esc(publico.deck)}?modo=notas#${n}"></iframe>` +
      `<div class="pines" data-pines aria-hidden="true"></div></div>` +
      `<div class="escenario__controles"><button class="boton boton--icono" type="button" data-anterior aria-label="Diapositiva anterior">${svg(ICONO.ant)}</button>` +
      `<span class="contador" data-contador></span><button class="boton boton--icono" type="button" data-siguiente aria-label="Diapositiva siguiente">${svg(ICONO.sig)}</button>` +
      `<p class="escenario__sigue" data-sigue></p></div></div><div class="notas" data-notas></div></div>` +
      `<ol class="completo" data-panel="completo">` + publico.diapositivas.map((d, i) => {
        const k = i + 1;
        return `<li class="completo__item" id="g-${k}"><figure class="completo__diapo"><div class="completo__imagen">` +
          `<img src="${esc(d.imagen)}" alt="Diapositiva ${k}: ${esc(d.titulo)}" width="1280" height="720" loading="lazy" decoding="async">` +
          `${d.marcas.map((m) => pinHTML(k, m)).join("")}</div><figcaption class="completo__pie"><span><strong>${k}.</strong> ${esc(d.titulo)}</span>` +
          `<button class="boton" type="button" data-presentar-desde="${k}">Presentar desde acá</button></figcaption></figure>` +
          `<div class="completo__notas">${pasosDe(k).map(pasoHTML).join("") || '<p class="paso__como">Esta diapositiva no tiene guion.</p>'}</div></li>`;
      }).join("") + `</ol>`;
    iframe = $("iframe", seccion);
    const leyenda = $("[data-leyenda]", seccion);
    if (leyenda && matchMedia("(min-width: 761px)").matches) leyenda.open = true;
    iframe.addEventListener("load", () => enviarAlIframe(n));
  }

  function pintarNotas() {
    const d = publico.diapositivas[n - 1];
    const pasos = pasosDe(n);
    $("[data-notas]").innerHTML =
      `<div class="notas__cabecera"><span class="notas__num">Diapositiva ${n} de ${total}</span><h3 class="notas__titulo">${esc(d.titulo)}</h3></div>` +
      (pasos.map(pasoHTML).join("") || '<p class="paso__como">Esta diapositiva no tiene guion.</p>');
    $("[data-contador]").textContent = `${n} / ${total}`;
    $("[data-anterior]").disabled = n === 1;
    $("[data-siguiente]").disabled = n === total;
    const sig = pasosDe(n + 1)[0];
    $("[data-sigue]").innerHTML = n < total
      ? `Sigue: <strong>${esc(publico.diapositivas[n].titulo)}</strong>${sig ? ` · ${esc(bloqueDe(sig).etiqueta)}` : ""}`
      : "Es la última diapositiva.";
  }

  let temporizadorPines = 0;
  function pintarPines() {
    const caja = $("[data-pines]");
    caja.classList.remove("pines--listo");
    caja.innerHTML = publico.diapositivas[n - 1].marcas.map((m) => pinHTML(n, m)).join("");
    clearTimeout(temporizadorPines);
    // Las marcas aparecen cuando la diapositiva terminó de entrar en la vista previa
    temporizadorPines = setTimeout(() => caja.classList.add("pines--listo"), reducido ? 0 : 750);
  }

  function marcarLinea() {
    const actuales = new Set(pasosDe(n).map((p) => p.bloque));
    $$("[data-bloque]", seccion).forEach((b) => {
      if (actuales.has(Number(b.dataset.bloque))) b.setAttribute("aria-current", "step");
      else b.removeAttribute("aria-current");
    });
    const actual = $(`[data-bloque][aria-current="step"]`, seccion);
    if (actual && actual.scrollIntoView) actual.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  function enviarAlIframe(k) {
    try { iframe.contentWindow.postMessage({ tipo: "pitch:ir", n: k }, location.origin); } catch (e) { /* todavía cargando */ }
  }

  function ir(k, origen) {
    k = Math.max(1, Math.min(total, Number(k) || 1));
    const cambio = k !== n;
    n = k;
    if (cambio || origen === "inicio") {
      pintarNotas();
      pintarPines();
      marcarLinea();
      pintarReloj();
      anuncio.textContent = `Diapositiva ${n} de ${total}: ${publico.diapositivas[n - 1].titulo}`;
      if (vista === "completo" && origen !== "inicio") {
        const item = document.getElementById(`g-${n}`);
        if (item) item.scrollIntoView({ behavior: reducido ? "auto" : "smooth", block: "start" });
      }
    }
    if (origen !== "iframe") enviarAlIframe(n);
    if (canal && origen !== "canal" && cambio) canal.postMessage({ tipo: "pitch:ir", n });
  }

  function cambiarVista(v) {
    vista = v;
    guardar(CLAVE.vista, v);
    $$("[data-vista]", seccion).forEach((b) => b.setAttribute("aria-pressed", String(b.dataset.vista === v)));
    $$("[data-panel]", seccion).forEach((p) => { p.hidden = p.dataset.panel !== v; });
  }

  /* ── Reloj de la exposición (persiste si se recarga la página) ── */
  const R = { corriendo: false, inicio: 0, acumulado: 0, id: 0 };
  try { Object.assign(R, JSON.parse(leer(CLAVE.reloj) || "{}")); } catch (e) { /* reloj nuevo */ }
  const transcurrido = () => R.acumulado + (R.corriendo ? (Date.now() - R.inicio) / 1000 : 0);
  function pintarReloj() {
    if (!G) return;
    const t = transcurrido();
    $("[data-reloj]").textContent = reloj(t);
    const fin = Math.max(...pasosDe(n).map((p) => p.inicio + p.segundos), 0);
    $("[data-plan]").innerHTML = fin ? `plan ${reloj(fin)}<span class="reloj__total"> de ${esc(G.duracion_texto)}</span>` : "";
    const atraso = t - fin;
    $("[data-reloj-caja]").dataset.estado = (R.corriendo || t > 0) && fin ? (atraso > 30 ? "muy-tarde" : atraso > 0 ? "tarde" : "") : "";
    const boton = $("[data-reloj-boton]");
    boton.setAttribute("aria-pressed", String(R.corriendo));
    $("[data-reloj-texto]").textContent = R.corriendo ? "Pausar" : t > 0 ? "Seguir" : "Empezar";
    boton.querySelector("path").setAttribute("d", R.corriendo ? "M9 6v12M15 6v12" : "M8 5.5v13l10-6.5z");
  }
  function guardarReloj() { guardar(CLAVE.reloj, JSON.stringify({ corriendo: R.corriendo, inicio: R.inicio, acumulado: R.acumulado })); }
  function alternarReloj() {
    if (R.corriendo) { R.acumulado = transcurrido(); R.corriendo = false; } else { R.inicio = Date.now(); R.corriendo = true; }
    guardarReloj();
    pintarReloj();
  }
  setInterval(() => { if (R.corriendo) pintarReloj(); }, 500);

  function abrirGuion(datos, animar) {
    G = datos;
    armar();
    puerta.hidden = true;
    seccion.hidden = false;
    acciones.hidden = false;
    if (animar && !reducido) seccion.classList.add("guion--entra");
    cambiarVista(vista);
    ir(1, "inicio");
    $("[data-foco]", seccion).focus();
    if (canal) canal.postMessage({ tipo: "pitch:quien" }); // si el deck ya está abierto en otra pestaña, seguirlo

    seccion.addEventListener("click", (e) => {
      const b = e.target.closest("button");
      if (!b) return;
      if (b.dataset.vista) cambiarVista(b.dataset.vista);
      else if (b.dataset.bloque != null) ir(G.pasos.find((p) => p.bloque === Number(b.dataset.bloque)).n);
      else if (b.hasAttribute("data-anterior")) ir(n - 1);
      else if (b.hasAttribute("data-siguiente")) ir(n + 1);
      else if (b.dataset.presentarDesde) { cambiarVista("presentador"); ir(Number(b.dataset.presentarDesde)); window.scrollTo({ top: 0 }); }
      else if (b.dataset.pin) resaltar(b.dataset.pin, true);
    });
    const resaltar = (num, si) => $$(`.pines .pin[data-pin="${num}"]`, seccion).forEach((p) => p.classList.toggle("pin--activo", si));
    ["mouseover", "focusin"].forEach((ev) => seccion.addEventListener(ev, (e) => {
      const c = e.target.closest(".cue--senal");
      if (c) resaltar(c.dataset.pin, true);
    }));
    ["mouseout", "focusout"].forEach((ev) => seccion.addEventListener(ev, (e) => {
      const c = e.target.closest(".cue--senal");
      if (c) resaltar(c.dataset.pin, false);
    }));
  }

  /* Mensajes: la vista previa (postMessage) y otra pestaña con el deck, si la hay (BroadcastChannel) */
  window.addEventListener("message", (e) => {
    if (!G || e.origin !== location.origin || !e.data || e.data.tipo !== "pitch:diapo") return;
    if (iframe && e.source === iframe.contentWindow) ir(e.data.n, "iframe");
  });
  if (canal) canal.onmessage = (e) => {
    const m = e.data || {};
    if (G && m.tipo === "pitch:diapo") ir(m.n, "canal");
  };

  /* Teclado: ← → y Av/Re Pág cambian de diapositiva; T, reloj */
  document.addEventListener("keydown", (e) => {
    if (!G || e.altKey || e.ctrlKey || e.metaKey || e.defaultPrevented) return;
    if (e.target.closest("input, textarea, select")) return;
    const enControl = e.target.closest("button, a");
    const presentando = vista === "presentador";
    if (e.key === "ArrowRight" || (presentando && (e.key === "PageDown" || (e.key === " " && !enControl)))) { e.preventDefault(); ir(n + 1); }
    else if (e.key === "ArrowLeft" || (presentando && e.key === "PageUp")) { e.preventDefault(); ir(n - 1); }
    else if (presentando && e.key === "Home") { e.preventDefault(); ir(1); }
    else if (presentando && e.key === "End") { e.preventDefault(); ir(total); }
    else if (e.key === "t" || e.key === "T") { e.preventDefault(); alternarReloj(); }
  });

  $("[data-reloj-boton]").addEventListener("click", alternarReloj);
  $("[data-reloj-reiniciar]").addEventListener("click", () => {
    R.corriendo = false; R.acumulado = 0; R.inicio = 0;
    guardarReloj();
    pintarReloj();
  });
  // El código no se guarda en ningún lado: al refrescar la página hay que volver a ponerlo (pedido de Matías).
  $("[data-bloquear]").addEventListener("click", () => location.reload());
  if (matchMedia("(pointer: fine)").matches) casillas[0].focus();
})();

</script>
</body>
